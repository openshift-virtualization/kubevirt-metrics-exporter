# KME owns its dedicated namespace, so isolate all pods by default and add only
# the traffic the exporter needs. Health probes are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubevirt-metrics-exporter-default-deny
  namespace: kubevirt-metrics-exporter
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# KME uses in-cluster Kubernetes clients to watch Pods and ConfigMaps and to
# retrieve VMIs. Permit the Kubernetes service port without pinning an IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubevirt-metrics-exporter-allow-api-server
  namespace: kubevirt-metrics-exporter
spec:
  podSelector:
    matchLabels:
      app: kubevirt-metrics-exporter
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443
---
# The base and Kubernetes deployments serve unauthenticated HTTP metrics on
# 8080. The OpenShift overlay replaces this port with mTLS-protected 8443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubevirt-metrics-exporter-allow-metrics
  namespace: kubevirt-metrics-exporter
spec:
  podSelector:
    matchLabels:
      app: kubevirt-metrics-exporter
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
